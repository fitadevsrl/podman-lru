name: Release

# Pushing a tag vX.Y.Z publishes the container image to Docker Hub as
# fitadevsrl/podman-lru:X.Y.Z and :latest, builds the RPM and attaches it to a
# GitHub release. Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v*"]

env:
  IMAGE: docker.io/fitadevsrl/podman-lru

jobs:
  version:
    name: Check version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          spec=$(sed -n 's/^Version:[[:space:]]*//p' packaging/podman-lru.spec)
          echo "tag=$tag cargo=$cargo spec=$spec"
          [ "$tag" = "$cargo" ] || { echo "::error::tag $tag does not match Cargo.toml version $cargo"; exit 1; }
          [ "$tag" = "$spec" ] || { echo "::error::tag $tag does not match spec Version $spec"; exit 1; }
          echo "version=$tag" >>"$GITHUB_OUTPUT"

  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [version, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Build RPM and create release
    runs-on: ubuntu-latest
    needs: [version, test, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make rpm
        env:
          ENGINE: docker
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
          generate_release_notes: true
          body: |
            Container image: `${{ env.IMAGE }}:${{ needs.version.outputs.version }}`

            Install on RHEL 8: `sudo dnf install ./podman-lru-${{ needs.version.outputs.version }}-1.el8.noarch.rpm`,
            then edit `/etc/sysconfig/podman-lru` and `sudo systemctl enable --now podman-lru`.
